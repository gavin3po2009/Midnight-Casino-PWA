<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle</title>
<style>
  :root {
    --bg: #121213;
    --text: #f8f8f8;
    --border: #3a3a3c;
    --border-filled: #565758;
    --key: #818384;
    --correct: #538d4e;
    --present: #b59f3b;
    --absent: #3a3a3c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; align-items: center; }

  header {
    width: 100%; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
  }
  header h1 { margin: 0; font-size: 2rem; letter-spacing: 0.1em; }
  header button {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.9rem;
  }
  header button:hover { background: var(--border); }

  #game {
    flex: 1; width: 100%; max-width: 500px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 12px 8px;
  }

  #board {
    display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px;
    width: min(350px, 90vw); height: min(420px, 108vw);
    margin: 0 auto; flex-shrink: 0;
  }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .row.shake { animation: shake 0.5s; }
  .tile {
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: bold; text-transform: uppercase;
    user-select: none;
  }
  .tile.filled { border-color: var(--border-filled); animation: pop 0.1s; }
  .tile.flip { animation: flip 0.5s ease forwards; }
  .tile.correct { background: var(--correct); border-color: var(--correct); }
  .tile.present { background: var(--present); border-color: var(--present); }
  .tile.absent  { background: var(--absent);  border-color: var(--absent); }
  .tile.win { animation: bounce 0.4s ease; }

  #keyboard { margin-top: 16px; user-select: none; }
  .key-row { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
  .key {
    flex: 1; max-width: 43px; height: 58px;
    border: none; border-radius: 4px; background: var(--key); color: var(--text);
    font-size: 1rem; font-weight: bold; text-transform: uppercase; cursor: pointer;
    padding: 0; transition: background 0.2s;
  }
  .key.wide { max-width: 66px; flex: 1.5; font-size: 0.75rem; }
  .key.correct { background: var(--correct); }
  .key.present { background: var(--present); }
  .key.absent  { background: var(--absent); }
  .spacer { flex: 0.5; }

  #toast {
    position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none; z-index: 10;
  }
  .toast-msg {
    background: var(--text); color: var(--bg); padding: 12px 16px;
    border-radius: 4px; font-weight: bold; transition: opacity 0.3s;
  }

  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #modal.show { display: flex; }
  .modal-box {
    background: #1e1e1f; border: 1px solid var(--border); border-radius: 8px;
    padding: 24px; width: min(360px, 90vw); text-align: center;
  }
  .modal-box h2 { margin-top: 0; }
  .stats { display: flex; justify-content: space-around; margin: 16px 0; }
  .stat .num { font-size: 1.8rem; font-weight: bold; }
  .stat .lbl { font-size: 0.7rem; }
  .dist { text-align: left; margin: 12px 0; }
  .dist-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; font-size: 0.85rem; }
  .dist-bar {
    background: var(--absent); padding: 2px 6px; text-align: right;
    min-width: 20px; font-weight: bold;
  }
  .dist-bar.hl { background: var(--correct); }
  .modal-box button {
    background: var(--correct); color: #fff; border: none; border-radius: 4px;
    padding: 12px 24px; font-size: 1rem; font-weight: bold; cursor: pointer; margin: 4px;
  }
  .modal-box button.secondary { background: var(--key); }

  @keyframes pop { 50% { transform: scale(1.1); } }
  @keyframes flip {
    0% { transform: rotateX(0); }
    50% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  @keyframes bounce {
    0%, 20% { transform: translateY(0); }
    40% { transform: translateY(-30px); }
    50% { transform: translateY(5px); }
    60% { transform: translateY(-15px); }
    80% { transform: translateY(2px); }
    100% { transform: translateY(0); }
  }
</style>
</head>
<body>
<header>
  <button id="statsBtn">Stats</button>
  <h1>WORDLE</h1>
  <button id="newBtn">New Game</button>
</header>

<div id="toast"></div>

<main id="game">
  <div id="board"></div>
  <div id="keyboard"></div>
</main>

<div id="modal">
  <div class="modal-box">
    <h2 id="modalTitle">Statistics</h2>
    <div id="modalAnswer"></div>
    <div class="stats">
      <div class="stat"><div class="num" id="sPlayed">0</div><div class="lbl">Played</div></div>
      <div class="stat"><div class="num" id="sWin">0</div><div class="lbl">Win %</div></div>
      <div class="stat"><div class="num" id="sStreak">0</div><div class="lbl">Current Streak</div></div>
      <div class="stat"><div class="num" id="sMax">0</div><div class="lbl">Max Streak</div></div>
    </div>
    <h3>Guess Distribution</h3>
    <div class="dist" id="dist"></div>
    <button id="playAgainBtn">Play Again</button>
    <button id="closeBtn" class="secondary">Close</button>
  </div>
</div>

const VALID = new Set([...ANSWERS, ...EXTRA_GUESSES]);

// ---------- State ----------
const ROWS = 6, COLS = 5, FLIP_MS = 300;
let answer, guesses, current, gameOver, busy;

const boardEl = document.getElementById('board');
const kbEl = document.getElementById('keyboard');
const toastEl = document.getElementById('toast');
const modal = document.getElementById('modal');

// ---------- Build board & keyboard ----------
function buildBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    for (let c = 0; c < COLS; c++) {
      const t = document.createElement('div');
      t.className = 'tile';
      row.appendChild(t);
    }
    boardEl.appendChild(row);
  }
}

function buildKeyboard() {
  const layout = ['qwertyuiop', ' asdfghjkl ', '+zxcvbnm-'];
  kbEl.innerHTML = '';
  for (const line of layout) {
    const row = document.createElement('div');
    row.className = 'key-row';
    for (const ch of line) {
      if (ch === ' ') { const s = document.createElement('div'); s.className = 'spacer'; row.appendChild(s); continue; }
      const k = document.createElement('button');
      k.className = 'key';
      if (ch === '+') { k.textContent = 'Enter'; k.dataset.key = 'Enter'; k.classList.add('wide'); }
      else if (ch === '-') { k.textContent = '⌫'; k.dataset.key = 'Backspace'; k.classList.add('wide'); }
      else { k.textContent = ch; k.dataset.key = ch; }
      row.appendChild(k);
    }
    kbEl.appendChild(row);
  }
}

// ---------- Game flow ----------
function newGame() {
  answer = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
  guesses = [];
  current = '';
  gameOver = false;
  busy = false;
  buildBoard();
  buildKeyboard();
  modal.classList.remove('show');
}

function handleKey(key) {
  if (gameOver || busy) return;
  if (key === 'Enter') return submitGuess();
  if (key === 'Backspace') {
    current = current.slice(0, -1);
    return renderCurrent();
  }
  if (/^[a-zA-Z]$/.test(key) && current.length < COLS) {
    current += key.toLowerCase();
    renderCurrent();
  }
}

function renderCurrent() {
  const tiles = boardEl.children[guesses.length].children;
  for (let i = 0; i < COLS; i++) {
    tiles[i].textContent = current[i] || '';
    tiles[i].classList.toggle('filled', !!current[i]);
  }
}

// Scores a guess with correct handling of duplicate letters.
function score(guess, target) {
  const result = Array(COLS).fill('absent');
  const counts = {};
  for (let i = 0; i < COLS; i++) {
    if (guess[i] === target[i]) result[i] = 'correct';
    else counts[target[i]] = (counts[target[i]] || 0) + 1;
  }
  for (let i = 0; i < COLS; i++) {
    if (result[i] !== 'correct' && counts[guess[i]] > 0) {
      result[i] = 'present';
      counts[guess[i]]--;
    }
  }
  return result;
}

function submitGuess() {
  const rowEl = boardEl.children[guesses.length];
  if (current.length < COLS) return reject(rowEl, 'Not enough letters');
  if (!VALID.has(current)) return reject(rowEl, 'Not in word list');

  const guess = current;
  const result = score(guess, answer);
  guesses.push(guess);
  current = '';
  busy = true;

  [...rowEl.children].forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.add('flip');
      setTimeout(() => tile.classList.add(result[i]), 250);
    }, i * FLIP_MS);
  });

  setTimeout(() => {
    updateKeyboard(guess, result);
    busy = false;
    if (guess === answer) {
      gameOver = true;
      [...rowEl.children].forEach((t, i) => setTimeout(() => t.classList.add('win'), i * 100));
      const praise = ['Genius', 'Magnificent', 'Impressive', 'Splendid', 'Great', 'Phew'];
      toast(praise[guesses.length - 1], 1800);
      recordResult(true, guesses.length);
      setTimeout(() => showStats('You win!'), 2000);
    } else if (guesses.length === ROWS) {
      gameOver = true;
      toast(answer.toUpperCase(), 2500);
      recordResult(false);
      setTimeout(() => showStats('Game over'), 2000);
    }
  }, COLS * FLIP_MS + 250);
}

function reject(rowEl, msg) {
  toast(msg);
  rowEl.classList.remove('shake');
  void rowEl.offsetWidth; // restart animation
  rowEl.classList.add('shake');
}

function updateKeyboard(guess, result) {
  const rank = { absent: 0, present: 1, correct: 2 };
  for (let i = 0; i < COLS; i++) {
    const k = kbEl.querySelector(`[data-key="${guess[i]}"]`);
    const prev = ['correct', 'present', 'absent'].find(c => k.classList.contains(c));
    if (!prev || rank[result[i]] > rank[prev]) {
      k.classList.remove('correct', 'present', 'absent');
      k.classList.add(result[i]);
    }
  }
}

function toast(msg, ms = 1200) {
  const el = document.createElement('div');
  el.className = 'toast-msg';
  el.textContent = msg;
  toastEl.prepend(el);
  setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, ms);
}

// ---------- Stats (saved in localStorage) ----------
function loadStats() {
  try {
    return JSON.parse(localStorage.getItem('wordle-stats')) || null;
  } catch { return null; }
}
function getStats() {
  return loadStats() || { played: 0, wins: 0, streak: 0, maxStreak: 0, dist: [0,0,0,0,0,0] };
}
function recordResult(won, n) {
  const s = getStats();
  s.played++;
  if (won) {
    s.wins++; s.streak++; s.maxStreak = Math.max(s.maxStreak, s.streak); s.dist[n - 1]++;
  } else {
    s.streak = 0;
  }
  try { localStorage.setItem('wordle-stats', JSON.stringify(s)); } catch {}
  s.last = won ? n : null;
  return s;
}

function showStats(title = 'Statistics') {
  const s = getStats();
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalAnswer').textContent =
    gameOver ? `The word was ${answer.toUpperCase()}` : '';
  document.getElementById('sPlayed').textContent = s.played;
  document.getElementById('sWin').textContent = s.played ? Math.round(100 * s.wins / s.played) : 0;
  document.getElementById('sStreak').textContent = s.streak;
  document.getElementById('sMax').textContent = s.maxStreak;
  const max = Math.max(1, ...s.dist);
  const won = gameOver && guesses[guesses.length - 1] === answer;
  document.getElementById('dist').innerHTML = s.dist.map((v, i) => `
    <div class="dist-row"><span>${i + 1}</span>
      <div class="dist-bar ${won && guesses.length === i + 1 ? 'hl' : ''}" style="width:${Math.max(8, 100 * v / max)}%">${v}</div>
    </div>`).join('');
  modal.classList.add('show');
}

// ---------- Events ----------
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (modal.classList.contains('show')) {
    if (e.key === 'Escape') modal.classList.remove('show');
    return;
  }
  handleKey(e.key);
});
kbEl.addEventListener('click', e => {
  const k = e.target.closest('.key');
  if (k) { handleKey(k.dataset.key); k.blur(); }
});
document.getElementById('newBtn').addEventListener('click', e => { e.target.blur(); newGame(); });
document.getElementById('statsBtn').addEventListener('click', e => { e.target.blur(); showStats(); });
document.getElementById('playAgainBtn').addEventListener('click', newGame);
document.getElementById('closeBtn').addEventListener('click', () => modal.classList.remove('show'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('show'); });

newGame();
</script>
</body>
</html>
